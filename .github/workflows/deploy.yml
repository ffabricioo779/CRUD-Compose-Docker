
name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker
        run: |
          echo "Iniciando o deploy..."
          docker compose up -d --build
          docker compose ps
          echo "Deploy realizado com sucesso!"
